[package]
name = "shard-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Core library for shard distributed VCS: chunking, compression, commits, branching, merging, WAL"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords = ["vcs", "version-control", "mlops", "distributed", "content-addressed"]
categories = ["compression"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
shard-crypto = { path = "../crypto", version = "2.4.1" }
shard-storage = { path = "../storage", version = "2.4.1" }
shard-net = { path = "../net", version = "2.4.1" }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
time = { workspace = true }
zstd = { version = "0.13", default-features = false }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
tar = { workspace = true }
tracing = "0.1.44"
aes-gcm = { workspace = true }
rand = { workspace = true }
similar = { workspace = true }
ciborium = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
once_cell = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
ignore = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
crc32fast = { workspace = true }
fs2 = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
criterion = "0.5"
tower = { version = "0.5", features = ["util"] }

[[bench]]
name = "chunker"
harness = false

[[bench]]
name = "compression"
harness = false

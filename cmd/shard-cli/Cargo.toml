[package]
name = "shard-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI for shard distributed VCS — content-addressed version control for large ML artifacts"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/shard-cli"
readme.workspace = true
keywords = ["vcs", "version-control", "mlops", "distributed", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "shard"
path = "src/main.rs"

[dependencies]
shard-core = { path = "../../core", version = "2.5.0" }
shard-crypto = { path = "../../crypto", version = "2.5.0" }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = "4.5"
anyhow = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
blake3 = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }
serde_json = { workspace = true }

[package]
name = "shard-net"
version.workspace = true
edition.workspace = true
description = "libp2p networking for shard distributed VCS (TCP/Noise/Yamux, mDNS, Kademlia, Gossipsub)"
license.workspace = true
repository.workspace = true
keywords = ["vcs", "version-control", "mlops", "distributed", "libp2p"]
categories = ["network-programming"]

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
libp2p = { version = "0.57", features = ["tcp", "dns", "quic", "noise", "yamux", "gossipsub", "kad", "request-response", "cbor", "json", "macros", "tokio", "mdns", "identify", "ping", "relay", "dcutr", "autonat"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
futures = "0.3"
tracing = "0.1.44"
ed25519-dalek = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
ciborium = { workspace = true }

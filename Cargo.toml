[workspace]
members = [
    "cmd/shard-cli",
    "core",
    "net",
    "crypto",
    "storage",
    "tests",
]
exclude = ["python/shard-py"]
resolver = "2"

[workspace.package]
version = "2.4.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/sandy-sachin7/shard"
homepage = "https://sandy-sachin7.github.io/shard/"
documentation = "https://docs.rs/shard-core"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
ed25519-dalek = "2.1"
hex = "0.4"
tempfile = "3.20"
walkdir = "2.5"
time = { version = "0.3.47", features = ["formatting"] }
tar = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
similar = "2"
ciborium = "0.2"
argon2 = "0.5"
axum = "0.7"
tower-http = { version = "0.7", features = ["cors"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
uuid = { version = "1", features = ["v4"] }
parking_lot = { version = "0.12", features = ["arc_lock"] }
once_cell = "1.21"
ignore = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
crc32fast = "1.4"
fs2 = "0.4"

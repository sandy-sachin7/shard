name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: shard

jobs:
  build:
    name: Build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────────────────────
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_suffix: x86_64-linux.tar.gz
            cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_suffix: aarch64-linux.tar.gz
            cross: true

          # ── macOS ──────────────────────────────────────────────────────────
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_suffix: x86_64-macos.tar.gz
            cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: aarch64-macos.tar.gz
            cross: false

          # ── Windows ────────────────────────────────────────────────────────
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: x86_64-windows.zip
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl targets)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools

      - name: Install cross (aarch64)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        shell: bash
        run: |
          cross build --release --locked --target ${{ matrix.target }}

      # ── Package ────────────────────────────────────────────────────────────
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/${BINARY_NAME}"
          STAGING="${BINARY_NAME}-${{ github.ref_name }}-${{ matrix.asset_suffix }}"
          STAGING="${STAGING%.tar.gz}"
          mkdir -p "${STAGING}"
          cp "${BINARY}" "${STAGING}/"
          cp README.md CHANGELOG.md LICENSE "${STAGING}/"
          tar czf "${STAGING}.tar.gz" "${STAGING}"
          echo "ASSET=${STAGING}.tar.gz" >> $GITHUB_ENV

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"
          fi
          echo "ASSET_SHA=${STAGING}.tar.gz.sha256" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/${env:BINARY_NAME}.exe"
          $staging = "${env:BINARY_NAME}-${{ github.ref_name }}-${{ matrix.asset_suffix }}"
          $staging = $staging -replace '\.zip$', ''
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item $binary "$staging\"
          Copy-Item README.md, CHANGELOG.md, LICENSE "$staging\"
          Compress-Archive -Path "$staging\*" -DestinationPath "$staging.zip"
          echo "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $hash = (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $staging.zip" | Out-File -Encoding utf8 "$staging.zip.sha256"
          echo "ASSET_SHA=$staging.zip.sha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          awk '/^## /{ if (found) exit; found=1 } found { print }' CHANGELOG.md > release_notes.md

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}

  # ── Publish crate to crates.io after all builds succeed ──────────────────
  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish shard-crypto
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p shard-crypto

      - name: Publish shard-storage
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p shard-storage

      - name: Publish shard-net
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p shard-net

      - name: Wait for crates.io index propagation (leaf crates)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for crate in shard-crypto shard-storage shard-net; do
            echo "Waiting for ${crate} ${VERSION} on crates.io..."
            for i in $(seq 1 30); do
              if curl -fsSL "https://crates.io/api/v1/crates/${crate}/${VERSION}" >/dev/null 2>&1; then
                echo "${crate} ${VERSION} is live."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Timed out waiting for ${crate} ${VERSION} on crates.io" >&2
                exit 1
              fi
              sleep 10
            done
          done

      - name: Publish shard-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p shard-core

      - name: Wait for crates.io index propagation (shard-core)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Waiting for shard-core ${VERSION} on crates.io..."
          for i in $(seq 1 30); do
            if curl -fsSL "https://crates.io/api/v1/crates/shard-core/${VERSION}" >/dev/null 2>&1; then
              echo "shard-core ${VERSION} is live."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Timed out waiting for shard-core ${VERSION} on crates.io" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Publish shard-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p shard-cli

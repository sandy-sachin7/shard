[package]
name = "shard-py"
version = "2.4.1"
edition = "2021"
description = "Native Python bindings for shard distributed VCS via PyO3"
license = "MIT"
repository = "https://github.com/sandy-sachin7/shard"

[workspace]

[lib]
name = "shard"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
shard-core = { path = "../../core" }
serde_json = "1.0"
anyhow = "1.0"

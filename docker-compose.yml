services:
  node-a:
    build: .
    hostname: node-a
    working_dir: /data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "=== Node A ==="
        if [ ! -d /data/.shard ]; then
          shard init
          echo "test content from A" > /data/file-a.txt
          shard add file-a.txt
          shard commit -m "initial commit from A" --author "Node A"
        fi
        exec shard share --listen /ip4/0.0.0.0/tcp/9090
    ports:
      - "9090:9090"
    volumes:
      - shard-data-a:/data

  node-b:
    build: .
    hostname: node-b
    working_dir: /data
    depends_on:
      - node-a
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "=== Node B ==="
        if [ ! -d /data/.shard ]; then
          shard init
          echo "test content from B" > /data/file-b.txt
          shard add file-b.txt
          shard commit -m "initial commit from B" --author "Node B"
        fi
        exec shard share --listen /ip4/0.0.0.0/tcp/9091
    ports:
      - "9091:9091"
    volumes:
      - shard-data-b:/data

  relay:
    build: .
    hostname: relay
    working_dir: /data
    command: ["relay", "--listen", "/ip4/0.0.0.0/tcp/9092"]
    ports:
      - "9092:9092"

volumes:
  shard-data-a:
  shard-data-b:
